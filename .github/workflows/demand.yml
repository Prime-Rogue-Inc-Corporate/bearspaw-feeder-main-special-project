name: Daily demand charts

# Archive the City's daily water demand charts into raw/city/daily-demand/ (tools/fetch_demand.py).
# The City posts one chart a day during a feeder main shutdown and links only the newest, so they are collected twice a day.
# GitHub can start scheduled runs hours late; that does not matter here, because each run looks back 10 days.
# Remove the schedule once Stage 4 restrictions have ended and the last chart is stored.

on:
  schedule:
    - cron: "23 3,15 * * *"
  push:
    branches: [main]
    paths: ["trigger/demand-backfill.txt"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: raw-fetch
  cancel-in-progress: false

jobs:
  demand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: python3 tools/fetch_demand.py
      - name: Commit
        id: commit
        run: |
          git config user.name "rwi-raw-fetch"
          git config user.email "rwi-raw-fetch@users.noreply.github.com"
          git add -A raw
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Daily demand charts $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main && git push
          echo "new=1" >> "$GITHUB_OUTPUT"
      - name: Stamp the new files
        if: steps.commit.outputs.new == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stamp.yml --ref main
