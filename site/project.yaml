headline: >-
  The Bearspaw South Feeder Main carries about 60 % of Calgary's treated water and has broken twice, in June 2024 and December
  2025. RWI keeps the open record, archives it with checksums and Bitcoin timestamps, and follows the connection and commissioning
  of the replacement main.
