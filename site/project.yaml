summary:
  - >-
    The Bearspaw South Feeder Main carries treated water from the Bearspaw treatment plant into north-west and central Calgary,
    about 60 % of the city's supply. Its prestressed concrete cylinder pipe ruptured on 5 June 2024 and again on 30 December 2025,
    the second time below 16 Avenue N.W. near Sarcee Trail.
  - >-
    The City's Independent Review Panel (final report 6 January 2026) found the risk had been known since the 2004 McKnight feeder
    main break, while planned inspections were deferred. The Province's municipal inspection by David Goldie (report MSD 016-26,
    dated 8 October, released 5 November 2026) found long-standing weaknesses in governance, risk management and capital delivery,
    and made 20 recommendations.
  - >-
    A replacement main is being connected now. From 4 November 2026 the existing line is shut for about four weeks while the new
    one is tied in, under city-wide Stage 4 outdoor water restrictions. The City says the new main should be in service in December.
  - >-
    This project keeps the public record in one place: City, Council and provincial documents, daily water-use figures, open data,
    river and weather series and satellite imagery, each archived unchanged with a SHA-256 checksum and an OpenTimestamps proof.
    Reports filed here separate what the record shows from inference.

